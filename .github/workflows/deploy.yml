name: Continuous Deployment (CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Hosting via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Build Frontend Assets (Vite)
        run: |
          npm ci || npm install --no-audit
          npm run build

      - name: 📂 Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 180000
          server-dir: /public_html/prokarelektronik.com/
          exclude: |
            .git
            .git/**
            .github
            .github/**
            **/node_modules/**
            .env
            .env.example
            tests/**
            storage/**
            public/storage
            public/storage/**

      - name: ⚡ Post-Deploy Optimize (clear & rebuild cache)
        run: |
          echo "Menunggu file FTP tersebar ke server..."
          sleep 10

          DEPLOY_TOKEN="${{ secrets.DEPLOY_KEY }}"
          if [ -z "$DEPLOY_TOKEN" ]; then
            DEPLOY_TOKEN="prokar_deploy_secure_5e5e7eb5b4d6cd717a454049db805ad2"
          fi

          echo "Mengirim webhook deploy optimize ke server hosting..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --resolve "prokarelektronik.com:443:203.175.9.180" \
            --resolve "docs.prokarelektronik.com:443:203.175.9.180" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "https://prokarelektronik.com/api/deploy/optimize" \
            --max-time 60 --retry 2)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Laravel cache berhasil di-optimize via deploy hook."
          else
            echo "⚠️ Percobaan pertama mengembalikan $HTTP_CODE. Mencoba via docs subdomain..."
            RESPONSE_DOCS=$(curl -s -w "\n%{http_code}" \
              --resolve "docs.prokarelektronik.com:443:203.175.9.180" \
              -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              "https://docs.prokarelektronik.com/api/deploy/optimize" \
              --max-time 60)

            HTTP_CODE_DOCS=$(echo "$RESPONSE_DOCS" | tail -n1)
            BODY_DOCS=$(echo "$RESPONSE_DOCS" | sed '$d')

            echo "HTTP Status Docs: $HTTP_CODE_DOCS"
            echo "Response Body Docs: $BODY_DOCS"

            if [ "$HTTP_CODE_DOCS" = "200" ]; then
              echo "✅ Laravel cache berhasil di-optimize via docs subdomain."
            else
              echo "⚠️ Optimize hook merespons HTTP $HTTP_CODE / $HTTP_CODE_DOCS. Cache dapat di-refresh via Super Admin Dashboard."
            fi
          fi
